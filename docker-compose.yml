services:
  cfsync:
    build: .
    container_name: cfsync
    restart: unless-stopped
    ports:
      - "8005:8005"
    # Create .env file here and override the settings below
    environment:
      - UI_PORT=8005
      - TZ=Asia/Jerusalem
      - PRINTER_URL=$PRINTER_URL
      - FILAMENT_DIAMETER=$FILAMENT_DIAMETER # Mostly 1.75
      - SPOOLMAN_URL=$SPOOLMAN_URL
      - SPOOLMAN_MODE=$SPOOLMAN_MODE # direct or moonraker
    volumes:
      # This ensures your filament data survives container updates
      - ./data:/opt/filament-management/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/"]
      interval: 30s
      timeout: 10s
      retries: 3
